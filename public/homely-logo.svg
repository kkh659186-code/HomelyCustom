<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Path for curved bottom text -->
    <path id="curveBottom" d="M 115 375 A 175 175 0 0 0 385 375" fill="none"/>
  </defs>

  <!-- Outer White Bevel Ring -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="3" filter="url(#badgeShadow)"/>
  
  <!-- Outer Dark Navy Border -->
  <circle cx="250" cy="250" r="215" fill="#E8EEF5" stroke="#1D3E53" stroke-width="8"/>
  
  <!-- Top Sky Area Background -->
  <clipPath id="circleClip">
    <circle cx="250" cy="250" r="211" />
  </clipPath>
  
  <g clip-path="url(#circleClip)">
    <!-- Sky Fill -->
    <rect x="0" y="0" width="500" height="340" fill="#9FBECB"/>
    
    <!-- Architectural Gear Cog Wheels (Right Sky) -->
    <!-- Large Gear -->
    <g transform="translate(370, 150) scale(0.65)" fill="#4A7081" stroke="#1D3E53" stroke-width="4">
      <circle cx="0" cy="0" r="42"/>
      <rect x="-10" y="-56" width="20" height="112" rx="4"/>
      <rect x="-56" y="-10" width="112" height="20" rx="4"/>
      <rect x="-42" y="-42" width="84" height="84" rx="4" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="22" fill="#9FBECB" stroke="#1D3E53" stroke-width="4"/>
    </g>
    <!-- Small Gear -->
    <g transform="translate(425, 205) scale(0.42)" fill="#5C8597" stroke="#1D3E53" stroke-width="4">
      <circle cx="0" cy="0" r="42"/>
      <rect x="-10" y="-56" width="20" height="112" rx="4"/>
      <rect x="-56" y="-10" width="112" height="20" rx="4"/>
      <rect x="-42" y="-42" width="84" height="84" rx="4" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="20" fill="#9FBECB" stroke="#1D3E53" stroke-width="4"/>
    </g>

    <!-- Green Tree on Left -->
    <g id="tree" stroke="#1D3E53" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <!-- Tree Trunk -->
      <path d="M 148 240 L 148 290" stroke="#1D3E53" stroke-width="14"/>
      <!-- Foliage Body -->
      <path d="M 148 150 C 110 150 100 200 115 250 C 130 280 170 280 185 250 C 200 200 190 150 148 150 Z" fill="#6B8E5F"/>
      <!-- Foliage Shadow & Highlights -->
      <path d="M 148 156 C 120 156 112 195 125 240 C 135 265 148 270 148 270 C 148 270 148 156 148 156 Z" fill="#7FA471"/>
      <line x1="148" y1="170" x2="148" y2="265" stroke="#1D3E53" stroke-width="5"/>
      <line x1="148" y1="210" x2="132" y2="195" stroke="#1D3E53" stroke-width="4"/>
      <line x1="148" y1="235" x2="165" y2="218" stroke="#1D3E53" stroke-width="4"/>
    </g>

    <!-- Shrub Bush -->
    <path d="M 160 275 C 150 260 175 245 195 255 C 215 245 235 260 225 280 Z" fill="#5A7D52" stroke="#1D3E53" stroke-width="6"/>

    <!-- The House Architectural Structure -->
    <g id="house" stroke="#1D3E53" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <!-- Chimney -->
      <rect x="186" y="140" width="28" height="45" fill="#547787"/>
      <rect x="180" y="134" width="40" height="10" rx="2" fill="#3D5F6E"/>
      
      <!-- Main House Body (Blue Base) -->
      <polygon points="160,215 250,135 340,215 340,285 160,285" fill="#4B7082"/>
      
      <!-- Painted White House Front Layer -->
      <path d="M 250 148 L 330 220 L 330 285 L 230 285 L 230 240 C 230 230 238 220 238 200 C 238 185 248 165 250 148 Z" fill="#FFFFFF"/>
      
      <!-- Wet Paint Drips on Facade -->
      <path d="M 230 205 Q 235 220 230 235 Q 225 250 230 260" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M 215 190 Q 220 205 215 220" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M 285 240 L 285 268" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M 305 240 L 305 272" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

      <!-- Roof Overhang Eaves -->
      <polyline points="145,225 250,130 355,225" fill="none" stroke="#1D3E53" stroke-width="12" stroke-linecap="round"/>
      <polyline points="152,223 250,136 348,223" fill="none" stroke="#FFFFFF" stroke-width="4"/>

      <!-- Attic Arch Window -->
      <path d="M 238 185 A 12 12 0 0 1 262 185 L 262 195 L 238 195 Z" fill="#244456"/>
      <line x1="250" y1="173" x2="250" y2="195" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="238" y1="185" x2="262" y2="185" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Left 4-Pane Window -->
      <rect x="190" y="228" width="36" height="36" rx="2" fill="#244456"/>
      <line x1="208" y1="228" x2="208" y2="264" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="190" y1="246" x2="226" y2="246" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Right 4-Pane Window -->
      <rect x="274" y="228" width="36" height="36" rx="2" fill="#244456"/>
      <line x1="292" y1="228" x2="292" y2="264" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="274" y1="246" x2="310" y2="246" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Front Door -->
      <rect x="236" y="235" width="28" height="50" fill="#A0673B"/>
      <circle cx="258" cy="262" r="2.5" fill="#1D3E53"/>
    </g>

    <!-- Hand Holding Paintbrush Painting House -->
    <g id="handAndBrush" stroke="#1D3E53" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- Brush Ferrule & Wet Bristles -->
      <!-- White Wet Paint on Tip -->
      <path d="M 235 235 L 255 212 L 275 230 L 252 254 Z" fill="#FFFFFF"/>
      <!-- Blue Paint Dipped Bristle Body -->
      <path d="M 245 224 L 270 196 L 292 216 L 265 242 Z" fill="#2D556E"/>
      <!-- Metal Ferrule -->
      <polygon points="268,198 284,180 304,198 288,217" fill="#BDC3C7"/>
      
      <!-- Wooden Brush Handle -->
      <path d="M 284 180 L 335 125 C 342 118 350 126 345 133 L 302 200 Z" fill="#C4884D"/>

      <!-- Painter's Hand & Arm -->
      <!-- Arm -->
      <path d="M 370 270 L 440 230 C 455 220 445 200 425 210 L 375 230" fill="#E8B896"/>
      <!-- Wrist & Palm -->
      <path d="M 340 215 C 345 195 375 190 395 205 C 410 215 405 245 375 255 Z" fill="#E8B896"/>
      <!-- Thumb -->
      <path d="M 295 195 C 285 185 300 170 315 180 C 330 190 325 205 310 205 Z" fill="#E8B896"/>
      <!-- Fingers Grasping Handle -->
      <path d="M 292 205 C 285 195 302 188 312 196 C 318 202 312 214 300 215 Z" fill="#DFAC8A"/>
      <path d="M 302 216 C 295 206 310 198 320 206 C 326 212 320 224 308 225 Z" fill="#DFAC8A"/>
      <path d="M 314 226 C 307 218 320 208 330 216 C 336 222 330 232 320 234 Z" fill="#DFAC8A"/>
    </g>

    <!-- Lower Green Lawn Ground Base -->
    <ellipse cx="250" cy="380" rx="230" ry="110" fill="#5F8A58" stroke="#1D3E53" stroke-width="7"/>
    <ellipse cx="250" cy="370" rx="220" ry="90" fill="#6C9B64"/>
  </g>

  <!-- Central Cream/White Horizontal Ribbon / Banner -->
  <g id="banner">
    <!-- Banner Upper & Lower Dark Navy Divider Bars -->
    <rect x="90" y="275" width="320" height="7" fill="#1D3E53"/>
    <rect x="90" y="336" width="320" height="7" fill="#1D3E53"/>
    <rect x="90" y="282" width="320" height="54" fill="#FFFFFF"/>
    
    <!-- Banner Main Title Text "HOMELY CUSTOM" -->
    <text x="250" y="325" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="900" fill="#9C5D33" text-anchor="middle" letter-spacing="3">
      HOMELY CUSTOM
    </text>
  </g>

  <!-- Arched Subtitle Text "DESIGN YOUR DREAM SPACE" -->
  <text font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="21" font-weight="900" fill="#1D3E53" letter-spacing="3.5">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      DESIGN YOUR DREAM SPACE
    </textPath>
  </text>
</svg>